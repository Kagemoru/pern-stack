<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      * {
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: sans-serif;
        font-size: 16px;
        background: #fff;
      }

      .container {
        max-width: 250px;
        text-align: center;
        padding: 1rem;
        border: 1px solid black;
        border-radius: 10px;
        background: #f2efeb;
      }

      #title {
        font-size: 1rem;
        color: #202124;
      }

      #code {
        font-weight: 700;
        font-size: 2rem;
        color: #202124;
        letter-spacing: 3px;
        margin: 0.75rem;
        padding: 0.7rem 1rem;
        border: 0;
        border: 2px solid #ff2e18;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;;
      }

      #code-msg {
        font-weight: 400;
        font-size: 1rem;
        font-style: italic;
        color: #4b4947;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title">&#64; PERN STACK</h1>
      <h2 id="code">{{code}}</h2>
      <p id="code-msg">Code will expire in 10 minutes.</p>
    </div>
  </body>
</html>
